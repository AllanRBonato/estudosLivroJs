<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        .tabela-imc {
            width: 100%;
            border-collapse: collapse;
            padding: 5%;
        }

        .tabela-imc th,
        .tabela-imc td {
            padding: 12px;
            text-align: center;
            color: rgb(0, 0, 0);
            border: 1px solid steelblue;
        }

        .paragrafo_resultado {
            background: #278f46;
            padding: 10px 20px;
        }
    </style>

    <title>Tabel IMC</title>
</head>

<body>
    <section class="container">
        <h1>Tabela IMC</h1>
        <table class="tabela-imc">
            <thead>
                <tr>
                    <th>IMC</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Menos do que 18,5</td>
                    <td>Abaixo do peso</td>
                </tr>
                <tr>
                    <td>Entre 18,5 e 24,9</td>
                    <td>Peso normal</td>
                </tr>
                <tr>
                    <td>Entre 25 e 29,9</td>
                    <td>Sobrepeso</td>
                </tr>
                <tr>
                    <td>Entre 30 e 34,9</td>
                    <td>Obesidade grau 1</td>
                </tr>
                <tr>
                    <td>Entre 35 e 39,9</td>
                    <td>Obesidade grau 2</td>
                </tr>
                <tr>
                    <td>Mais do que 40</td>
                    <td>Obesidade grau 3</td>
                </tr>
            </tbody>
        </table>

        <form>
            <h1>Calcule seu IMC</h1>
            <label for="input_peso">Peso:</label>
            <input type="text" id="input_peso">

            <label for="input_altura">Altura:</label>
            <input type="text" id="input_altura">

            <button type="submit">Mostrar IMC</button>
        </form>
        <div id="resultado"></div>

        <script>
            const form = document.querySelector('form');


            form.addEventListener('submit', function (e) {
                e.preventDefault();
            });

            };

            function setResultado(msg) {
                const resposta = document.getElementById('resultado');
                resposta.innerHTML = '';
                resposta.appendChild(p);
            };
        </script>
</body>

</html>
