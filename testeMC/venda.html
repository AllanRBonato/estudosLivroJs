<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">

    <title>MC</title>
</head>

<body>
    <header>
        <div class="logo-area">
            <span>MC Painel</span>
        </div>
        <nav>
            <ul>
                <li><a href="testeMC.html">Cadastros</a></li>
                <li><a href="venda.html" class="ativo">Vendas</a></li>
            </ul>
        </nav>
    </header>


    <!-- Cadastrar venda ------------------------ -->
    <div id="cadastrar_venda">

        <h1>Venda</h1>

        <label>
            Procurar Integrante/Visitante:
            <input type="search" id="">
        </label>
        
        <label>
            Produto:
            <input type="search" id="">
        </label>
        
        <label>
            Quantidade:
            <input type="number" id="">
        </label>

        <button>Adicionar</button>

        <hr>

        <pre id="visitante_integrante_venda"></pre>
        <pre id="nome_produto_venda"></pre>
        <pre id="valor_produto"></pre>

        <button id="">vender</button>
    </div>

    <hr>

    <div id="mostrar_vendas">

        <h1>Histórico de Vendas</h1>

        <label>
            Procurar (Integrante/Visitante):
            <input type="search" id="">
        </label>

        <button id="">Procurar</button>

        <hr>

        <div id="mostra_total">
            <pre id="cliente_integrante_total"></pre>
            <pre id="produtos_lista"></pre>
            <pre id="valores_lista"></pre>
            <pre id="valor_total"></pre>
        </div>

        <button>Fechar Venda</button>
    </div>

    <script src="./testeMC.js"></script>
