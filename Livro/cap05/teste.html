<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3 id="resposta"></h3>

    <script>
        const resp = document.getElementById('resposta');

        let numeros = '';
        for (let i = 1; i < 4; i++) {
            numeros = numeros + i
        }

        resp.innerText = numeros;
    </script>
</body>
</html>
