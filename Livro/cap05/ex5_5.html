<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="./img/livrojs.png" type="image/x-icon">

    <title>Document</title>
</head>

<body>
    <h1>Programa Contas do mês</h1>

    <form id="fomulario-contas">
        <label>
            Descrição da conta:
            <input type="text" name="descricaoInput">
        </label>
        <label>
            Valor a Pagar R$:
            <input type="number" name="valorInput" min="0.1" required>
        </label>

        <input type="submit" value="Registrar conta">
    </form>

    <pre id="saida-resposta1"></pre>
    <pre id="saida-resposta2"></pre>

    <script>
        const frmContas = document.getElementById('fomulario-contas');
        const saidaResposta1 = document.getElementById('saida-resposta1');
        const saidaResposta2 = document.getElementById('saida-resposta2');

        let resposta = '';
        let numeroDeContas = 0;
        let valorTotal = 0;

        frmContas.addEventListener('submit', (e) => {
            e.preventDefault();

            const descricao = frmContas.descricaoInput.value;
            const valor = Number(frmContas.valorInput.value);

            if (valor <= 0) {
                alert('O valor a pagar precisa ser maior que zero.')
                return
            };

            numeroDeContas++;
            valorTotal = valorTotal + valor;
            resposta = `${resposta + descricao} - R$: ${valor.toFixed(2)}\n`;
            saidaResposta1.innerText = `${resposta} -----------------------`;
            saidaResposta2.innerText = `${numeroDeContas} Conta(s) - Total R$: ${valorTotal.toFixed(2)}`;

            frmContas.descricaoInput.value = '';
            frmContas.valorInput.value = '';
            frmContas.descricaoInput.focus();
        });
    </script>
</body>

</html>
