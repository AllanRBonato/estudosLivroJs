<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        .tabela-imc {
            width: 100%;
            border-collapse: collapse;
            padding: 5%;
        }

        .tabela-imc th,
        .tabela-imc td {
            padding: 12px;
            text-align: center;
            color: rgb(0, 0, 0);
            border: 1px solid steelblue;
        }

        .paragrafo_resultado, .bad {
            background: #278f46;
            padding: 10px 20px;
        }

        .bad {
            background: #ae1e0b;
        }
    </style>

    <title>Tabel IMC</title>
</head>

<body>
    <section class="container">
        <h1>Tabela IMC</h1>
        <table class="tabela-imc">
            <thead>
                <tr>
                    <th>IMC</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Menos do que 18,5</td>
                    <td>Abaixo do peso</td>
                </tr>
                <tr>
                    <td>Entre 18,5 e 24,9</td>
                    <td>Peso normal</td>
                </tr>
                <tr>
                    <td>Entre 25 e 29,9</td>
                    <td>Sobrepeso</td>
                </tr>
                <tr>
                    <td>Entre 30 e 34,9</td>
                    <td>Obesidade grau 1</td>
                </tr>
                <tr>
                    <td>Entre 35 e 39,9</td>
                    <td>Obesidade grau 2</td>
                </tr>
                <tr>
                    <td>Mais do que 40</td>
                    <td>Obesidade grau 3</td>
                </tr>
            </tbody>
        </table>

        <form>
            <h1>Calcule seu IMC</h1>
            <label for="input_peso">Peso:</label>
            <input type="text" id="input_peso">

            <label for="input_altura">Altura:</label>
            <input type="text" id="input_altura">

            <button type="submit">Mostrar IMC</button>
        </form>
        <div id="resultado"></div>

        <script>
            const form = document.querySelector('form');


            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const inputPeso = e.target.querySelector('#input_peso');
                const inputAltura = e.target.querySelector('#input_altura');

                const peso = Number(inputPeso.value);
                const altura = Number(inputAltura.value);

                if (!peso) {
                    setResultado('Peso inválido', false);
                    return;
                }

                if (!altura) {
                    setResultado('Altura inválida', false);
                    return;
                }

                const imc = getImc(peso, altura);
                const nivelImc = getNivelImc(imc);

                const msg = `Seu IMC é ${imc} (${nivelImc})`;

                setResultado(msg, true);
            });

            function getImc(peso, altura) {
                const imc = peso / altura ** 2;
                return imc.toFixed(2);
            };

            function getNivelImc(imc) {
                const nivel = ['Abaixo do peso', 'Peso normal', 'Sobrepeso', 'Obesidade grau 1', 'Obesidade grau 2', 'Obesidade grau 3'];

                if (imc >= 39.9) return nivel[5];
                if (imc >= 34.9) return nivel[4];
                if (imc >= 29.9) return nivel[3];
                if (imc >= 24.9) return nivel[2];
                if (imc >= 18.5) return nivel[1];
                if (imc < 18.5) return nivel[0];
            };

            function criaP() {
                const p = document.createElement('p');
                return p;
            };

            function setResultado(msg, isValid) {
                const resposta = document.querySelector('#resultado');
                resposta.innerHTML = '';

                const p = criaP();

                if (isValid) {
                    p.classList.add('paragrafo_resultado');
                } else {
                    p.classList.add('bad');
                }

                p.innerHTML = msg;
                resposta.appendChild(p);
            };
        </script>
</body>

</html>
