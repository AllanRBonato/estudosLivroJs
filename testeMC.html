<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC</title>
</head>
<body>
    <form>
        <label>
            Procurar (Cliente/Integrante):
            <input type="search" id="">
        </label>

        <button id="">Procurar</button>

        <hr>

        <label>
            Cliente/Integrante:
            <input type="text" id="" required>
        </label>

        <label>
            Produto:
            <input type="text" id="" required>
        </label>

        <label>
            Valor:
            <input type="text" id="" required min="0.01">
        </label>

        <input type="submit" value="Salvar venda">
        <button id="">Adicionar novo produto</button>

        <label>
            Procurar Produto:
            <input type="search" id="">
        </label>
        <button>Excluir produto</button>
        <button>Alterar valor</button>
    </form>


    <div id="mostra_vendas">
        <label>
            Procurar (Cliente/Integrante):
            <input type="search" id="">
        </label>

        <button id="">Procurar</button>

        <hr>

        <div id="mostra_total">
            <pre id="cliente_integrante_total"></pre>
            <pre id="produtos_lista"></pre>
            <pre id="valores_lista"></pre>
            <pre id="valor_total"></pre>
        </div>

        <button>Fechar Venda</button>

        <div id="fechar_venda" class="oculto">
            <!-- modal de fechar venda -->
        </div>
    </div>
</body>
</html>
