<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./navbar.css">

</head>

<body>

    <div class="navbar-container">

        <div class="nav-logo-area">
            <a href="dashboard.html" id="nav-brand-container">
                <span id="nav-brand-text">ARB<span>.</span></span>
            </a>
        </div>

        <div class="nav-center-badge">
            <div class="nav-info-item">
                <img src="./img/img_navbar/icons8-relógio-480.png" class="img_logo_relogio_data" alt="Relógio">
                <span id="mostra_data_hora">--/--/---- --:--:--</span>
            </div>
            <div class="nav-info-divider">|</div>
            <div class="nav-info-item">
                <img src="./img/img_navbar/icons8-endereço-de-ip-80.png" class="img_logo_relogio_data" alt="IP">
                <span id="meu_ip">Buscando IP...</span>
            </div>
        </div>


        <div class="nav-user-area">
            <button class="user-avatar-btn" id="btn-user-avatar" aria-label="Menu do Usuário">
                <div class="user-avatar-container" id="nav-user-avatar">AU</div>
            </button>


            <div class="dropdown-menu" id="user-dropdown-list">
                <div class="dropdown-header">
                    Conectado como
                    <strong>Administrador</strong>
                </div>

                <input type="file" id="input-upload-foto" accept="image/*" style="display: none;">
                <a href="#" id="btn-alterar-foto">📷 Alterar Foto</a>

                <div class="dropdown-section-title">Navegação</div>
                <div id="dropdown-system-list">
                    <!-- Links montados via JS -->
                </div>

                <div class="dropdown-section-title"
                    style="margin-top: 4px; border-top: 1px solid var(--nav-border); padding-top: 8px;">Conta</div>
                <a href="perfil.html">👤 Meu Perfil</a>
                <a href="login.html" class="logout">🚪 Sair</a>
            </div>
        </div>

    </div>

    <script>

        // Edita relógio ---------------------------------------------------

        const mostrarDataHora = document.getElementById('mostra_data_hora');

        function zeroAEsquerda(num) {
            return num >= 10 ? num : `0${num}`;
        }

        function formataData(data) {
            const dia = zeroAEsquerda(data.getDate());
            const mes = zeroAEsquerda(data.getMonth() + 1);
            const ano = zeroAEsquerda(data.getFullYear());
            const hora = zeroAEsquerda(data.getHours());
            const min = zeroAEsquerda(data.getMinutes());
            const seg = zeroAEsquerda(data.getSeconds());

            return `${dia}/${mes}/${ano} - ${hora}:${min}:${seg}`;
        }

        function atualizarRelogio() {
            const data = new Date();
            const dataBrasil = formataData(data);
            mostrarDataHora.innerText = dataBrasil;
        }

        atualizarRelogio();

        setInterval(atualizarRelogio, 1000);

        // Pega meu IP ---------------------------------------------------


        async function obterIpPublico() {
            const meuIp = document.getElementById('meu_ip');

            try {
                const resposta = await fetch('https://api.ipify.org?format=json');
                const dados = await resposta.json();

                meuIp.innerText = `Seu IP de saída é: ${dados.ip}`;
            } catch (erro) {
                console.error("Erro ao recuperar o IP:", erro);
                meuIp.innerText = "Erro ao carregar o IP.";
            }
        }

        obterIpPublico();
    </script>
</body>

</html>
