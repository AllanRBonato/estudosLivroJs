<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotação Básica</title>
</head>

<body>
    <h2>Anotação Básica</h2>

    <form id="form_nota">
        <label>
            Digite uma nota:
            <input type="text" id="nota_digitada">
        </label>

        <input type="submit" value="Criar nota">
    </form>
    <h3 id="nota_salva"></h3>

    <script>
        const form_nota = document.getElementById('form_nota');
        const resposta = document.getElementById('nota_salva');


        form_nota.addEventListener('submit', (e) => {
            e.preventDefault();

            const dados = form_nota.nota_digitada.value;

            localStorage.setItem('nota_salva', JSON.stringify(dados));

            const recuperandoDados = JSON.parse(localStorage.getItem('nota_salva'));

            resposta.innerText = dados;
            
        })

        const recuperandoDados = JSON.parse(localStorage.getItem('nota_salva'));

        if (recuperandoDados) {
            resposta.innerText = recuperandoDados;
        }
    </script>
</body>

</html>
