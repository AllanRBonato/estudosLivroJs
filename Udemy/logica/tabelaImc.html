<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .tabela-imc {
            width: 100%;
            border-collapse: collapse;
            padding: 5%;
        }

        .tabela-imc th,
        .tabela-imc td {
            padding: 12px;
            text-align: center;
            color: rgb(0, 0, 0);
            border: 1px solid steelblue;
        }

        .resultado-erro {
            background: Red;
            color: white;
            font-size: 20px;
            text-align: center;
            padding: 10px;
        }
    </style>

    <title>MTabela IMC</title>
</head>

<body>

    <section class="container">
        <h1>Tabela IMC</h1>
        <table class="tabela-imc">
            <thead>
                <tr>
                    <th>IMC</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Menos do que 18,5</td>
                    <td>Abaixo do peso</td>
                </tr>
                <tr>
                    <td>Entre 18,5 e 24,9</td>
                    <td>Peso normal</td>
                </tr>
                <tr>
                    <td>Entre 25 e 29,9</td>
                    <td>Sobrepeso</td>
                </tr>
                <tr>
                    <td>Entre 30 e 34,9</td>
                    <td>Obesidade grau 1</td>
                </tr>
                <tr>
                    <td>Entre 35 e 39,9</td>
                    <td>Obesidade grau 2</td>
                </tr>
                <tr>
                    <td>Mais do que 40</td>
                    <td>Obesidade grau 3</td>
                </tr>
            </tbody>
        </table>

        <form>
            <h1>Calcule seu IMC</h1>
            <label for="input_peso">Peso:</label>
            <input type="text" id="input_peso">

            <label for="input_altura">Altura:</label>
            <input type="text" id="input_altura">

            <button>Enviar</button>
        </form>
        <h2 id="resultado"></h2>
    </section>

    <script>
        const form = document.querySelector('form');
        const resultado = document.getElementById('resultado');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const peso = Number(form.input_peso.value);
            const altura = Number(form.input_altura.value);

            if (!peso || !altura || peso <= 0 || altura <= 0) {
                resultado.innerText = `Peso ou Altura inválidos`
                resultado.className = "resultado-erro"
                return
            }

            const imc = peso / (altura * altura)
            let texto = '';
            let cor = '';

            if (imc < 18.5) {
                texto = 'Abaixo do peso'; cor = 'darkOrange';
            } else if (imc < 25) {
                texto = 'Peso normal'; cor = 'darkGreen';
            } else if (imc < 30) {
                texto = 'Sobrepeso'; cor = 'Gold';
            }
            else if (imc < 35) {
                texto = 'Obesidade grau 1'; cor = 'Orange';
            }
            else if (imc < 40) {
                texto = 'Obesidade grau 2'; cor = 'DarkOrange';
            }
            else {
                texto = 'Obesidade grau 3'; cor = 'DarkRed';
            }

            resultado.innerText = `Seu IMC é ${imc.toFixed(2)} (${texto})`;
            resultado.style.color = cor;
            resultado.style.fontSize = "20px";
            resultado.style.textAlign = "center";
            resultado.style.background = "none";
        })
    </script>
</body>

</html>
