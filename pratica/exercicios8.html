<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de compras</title>
</head>

<body>
    <h1>Carrinho</h1>
    <label>
        Produto:
        <input type="text" id="nomeProduto">
    </label>
    <label>
        Valor:
        <input type="text" id="valorProduto">
    </label>

    <button id="adicionar">Adicionar</button>

    <pre id="produtos"></pre>
    <pre id="valorTotal"></pre>

    <script>
        const inputProduto = document.getElementById('nomeProduto');
        const inputValor = document.getElementById('valorProduto');

        const btnEnviar = document.getElementById('adicionar');

        const mostraProduto = document.getElementById('produtos');
        const mostaValorTotal = document.getElementById('valorTotal');

        const carrinho = [];
        let totalCompra = 0;


        btnEnviar.addEventListener('click', (e) => {
            e.preventDefault();

            const produtos = inputProduto.value;
            const valor = Number(inputValor.value);

            carrinho.push(produtos);
            totalCompra = totalCompra + valor;

            inputProduto.value = '';
            inputValor.value = '';

            let valorFinal = 0;
            let mensagemProduto = '';
            let mensagemValor = '';

            if (totalCompra > 100) {
                valorFinal = totalCompra - (totalCompra * 0.10);
                alert(`Valor produto: R$${valor.toFixed(2)}\nProduto passou de R$100,00, tem 10% de desconto.`);
                mensagemProduto = `Produtos: ${carrinho}`;
                mensagemValor = `Valor total: ${valorFinal.toFixed(2)}`;
            } else {
                mensagemProduto = `Produtos: ${carrinho}`;
                mensagemValor = `Valor total: ${totalCompra.toFixed(2)}`;
            }

            mostraProduto.innerText = mensagemProduto;
            mostaValorTotal.innerText = mensagemValor;
        });
    </script>
</body>

</html>
